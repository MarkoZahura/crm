<!doctype html>
<html lang="uk" data-theme="light" data-accent="blue">
<head>

  <meta name="color-scheme" content="light dark">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">

  <!-- Тема й акцент застосовуються ще до малювання сторінки, щоб не було «блимання» -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var t = localStorage.getItem('crm.theme');
        var a = localStorage.getItem('crm.accent');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.setAttribute('data-theme', t);
        if (a) root.setAttribute('data-accent', a);
      } catch (e) { /* localStorage недоступний — лишається світла тема */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Chart.js (діаграми) — з CDN, асинхронно; якщо не завантажиться, сайт працює без діаграм -->

          crossorigin="anonymous"
          onload="document.dispatchEvent(new Event('crm:chartsready'))"
          onerror="window.__crmChartsFailed = true; document.dispatchEvent(new Event('crm:chartsfailed'))"></script>
